services:
  - type: web
    name: mahindra-training-hub
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mahindra-training-hub-db
          property: connectionString
      - key: INSTRUCTOR_PIN
        sync: false
      - key: APP_NAME
        value: Mahindra Technician Training Hub

databases:
  - name: mahindra-training-hub-db
    plan: basic-256mb
